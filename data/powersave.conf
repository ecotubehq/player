# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

screenshot-format=png

# Set video decoder
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Core Cache
cache=yes
cache-secs=40
demuxer-max-bytes=30MiB
demuxer-max-back-bytes=20MiB

# Power Saving
demuxer-hysteresis-secs=20
cache-pause=yes

# Set color
brightness=-5
contrast=-9
gamma=-3
saturation=12.2

# Enable dithering
dither=fruit
dither-size-fruit=6   
dither-depth=auto

# Set scaling
scale=hermite
cscale=bilinear
dscale=hermite

# Strong deband
[Deband 144-240]
profile-cond=p.width > 0 and p.width < 427
profile-desc="Strong deband"
profile-restore=copy
deband=yes
deband-iterations=3
deband-threshold=73
deband-range=25
deband-grain=5

# Medium deband
[Deband 360]
profile-cond=p.width > 426 and p.width < 641
profile-desc="Medium deband"
profile-restore=copy
deband=yes
deband-iterations=3
deband-threshold=60
deband-range=20
deband-grain=10

# Light deband
[Deband 480+]
profile-cond=p.width > 640
profile-desc="Light deband"
profile-restore=copy
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=20

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no
sigmoid-upscaling=no

# HDR → SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)

[40%-DesktopMode]
profile-cond=p.width > 0 and p.width < 257
profile-desc="144p Desktop Mode"
profile-restore=copy
geometry=40%x40%
keepaspect=yes

[60%-DesktopMode]
profile-cond=p.width > 256
profile-desc="240p+ Desktop Mode"
profile-restore=copy
geometry=60%x60%
keepaspect=yes