# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

# Select hardware accelerated output codec: av1 > vp9 > h.264 > software
#ytdl-format=(bestvideo[vcodec^=av1]/bestvideo[vcodec^=vp9]/bestvideo[vcodec^=h264]/bestvideo)[height>0][height<=360][fps<=30]+bestaudio/best

# Set video decoder
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Core Cache
cache=yes
cache-secs=22
demuxer-readahead-secs=22
demuxer-max-bytes=30MiB
demuxer-max-back-bytes=20MiB

# Power Saving
demuxer-hysteresis-secs=15
cache-pause=yes
cache-pause-wait=10

# Set Color
brightness=3
contrast=-12
gamma=0
saturation=37

# Enable dithering
dither=fruit
dither-size-fruit=6
dither-depth=auto

# Set scaling
scale=spline36
cscale=nearest
dscale=hermite

#glsl-shaders-append=#DATADIR#/ecotube/shaders/deband-noise.glsl

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no
sigmoid-upscaling=no
deband=no

#glsl-shaders-append=#DATADIR#/ecotube/shaders/CfL_Prediction_Lite.glsl

# HDR → SDR Tone-Mapping
tone-mapping=auto
target-peak=100
target-trc=bt.1886
target-prim=bt.709
gamut-mapping-mode=perceptual

glsl-shaders-append=#DATADIR#/ecotube/shaders/colorlevel_expand_luma.glsl

geometry=50%x50%
keepaspect=yes
