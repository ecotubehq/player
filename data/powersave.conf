# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

screenshot-format=png

# Set video decoder
hwdec=auto
vo=gpu-next

# Limit buffer to 20 sec
cache=yes
cache-secs=20
demuxer-readahead-secs=20
demuxer-max-back-bytes=24MiB
demuxer-max-bytes=64MiB
demuxer-cache-wait=yes

# Set color
brightness=-4
contrast=1
saturation=1.2

# Enable dithering
dither=fruit
dither-size-fruit=6   
dither-depth=auto

# Set scaling
scale=hermite
cscale=bilinear
dscale=hermite

# Disable deband
deband=no

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no
sigmoid-upscaling=no

# HDR → SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)