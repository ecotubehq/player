# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

# Select hardware accelerated output codec: av1 > vp9 > h.264 > software + max res 720p + 30fps if poss
#ytdl-format=(bestvideo[vcodec^=av1]/bestvideo[vcodec^=vp9]/bestvideo[vcodec^=h264]/bestvideo)[height<=360][fps<=31]+bestaudio/best

# Set video decoder
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Core Cache
cache=yes
cache-secs=22
demuxer-readahead-secs=22
demuxer-max-bytes=30MiB
demuxer-max-back-bytes=20MiB

# Power Saving
demuxer-hysteresis-secs=15
cache-pause=yes
cache-pause-wait=10

# Set Color
brightness=-1
contrast=-13
gamma=-3
saturation=23.2

glsl-shaders-append=./shaders/colorlevel_expand_luma.glsl
glsl-shaders-append=./shaders/kVibrance_RT.glsl

# Deband settings
deband=yes
deband-iterations=2
deband-threshold=40
deband-range=16
deband-grain=0

# Scaling
cscale=spline64
dscale=hermite

# Load FineSharp and FineDehalo
glsl-shaders-append=./shaders/FineDehalo_lite_RT.glsl
glsl-shaders-append=./shaders/FineSharp_RT.glsl

[SharpClean144-240]
profile-cond=p.width < 640
profile-desc="Sharpen and Clean Video"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55,FineDehalo_lite_RT/RX=1.0,RY=1.0,THMI=85,THMA=135,THLIMI=52,THLIMA=105,STR_D=0.4,STR_B=0.4,SENS_L=35,SENS_H=35,FineSharp_RT/SSTR=0.17,CSTR=0.17,LSTR=1.0,PSTR=1.0,XSTR=0.05,XREP=0.0

[SharpClean360]
profile-cond=p.width > 639 and p.width < 854
profile-desc="Sharpen and Clean Video"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55,FineDehalo_lite_RT/RX=1.0,RY=1.0,THMI=80,THMA=128,THLIMI=50,THLIMA=100,STR_D=0.92,STR_B=0.92,SENS_L=50,SENS_H=50,FineSharp_RT/SSTR=0.13,CSTR=0.19,LSTR=1.0,PSTR=1.0,XSTR=0.08,XREP=0.1

[SharpClean480]
profile-cond=p.width > 853 and p.width < 1280
profile-desc="Sharpen and Clean Video"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55,FineDehalo_lite_RT/RX=1.0,RY=1.0,THMI=90,THMA=150,THLIMI=55,THLIMA=110,STR_D=0.40,STR_B=0.40,SENS_L=35,SENS_H=35,FineSharp_RT/SSTR=0.09,CSTR=0.04,LSTR=1.0,PSTR=1.0,XSTR=0.0,XREP=0.0

glsl-shaders-append=./shaders/ravu-lite-ar-r4.hook

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no
sigmoid-upscaling=no

# HDR â†’ SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)

# Dynamic Peak Detection
hdr-compute-peak=yes           # dynamically analyze HDR peak per-frame
hdr-peak-percentile=99.8       # ignore outlier pixels when computing peak
gamut-mapping-mode=perceptual  # natural-looking gamut compression

[Geometry]
profile-cond=p.width < 1920
profile-desc="Geometry"
profile-restore=copy
geometry=50%x50%
keepaspect=yes

glsl-shaders-append=./shaders/grain.glsl
