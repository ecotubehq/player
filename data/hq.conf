# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

# Select hardware accelerated output codec: av1 > vp9 > h.264 > software + max res 720p + 30fps if poss
#ytdl-format=(bestvideo[vcodec^=av1]/bestvideo[vcodec^=vp9]/bestvideo[vcodec^=h264]/bestvideo)[height<=360][fps<=31]+bestaudio/best

# Set video decoder
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Core Cache
cache=yes
cache-secs=22
demuxer-readahead-secs=22
demuxer-max-bytes=30MiB
demuxer-max-back-bytes=20MiB

# Power Saving
demuxer-hysteresis-secs=15
cache-pause=yes
cache-pause-wait=10

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no
sigmoid-upscaling=no
deband=no

# Set Color
brightness=3
contrast=-5
gamma=3
saturation=37

[HeavyClean240]
profile-cond=p.width < 427
profile-desc="Heavy Clean <= 240p"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/denoise_gaussian_RT.glsl

glsl-shaders-append=#DATADIR#/ecotube/shaders/kCCD_RT.glsl
glsl-shaders-append=#DATADIR#/ecotube/shaders/kACfL_RT.glsl

[RAVU240]
profile-cond=p.width < 427
profile-desc="Upscaler <= 240p"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/ravu_3x_r4.glsl

[RAVU360]
profile-cond=p.width > 639 and p.width < 854
profile-desc="360p Upscaler"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/ravu-r4.hook

[RAVU480]
profile-cond=p.width > 853 and p.width < 1280
profile-desc="480p Upscaler"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/ravu-lite-ar-r2.glsl

[RAVU720]
profile-cond=p.width > 1279
profile-desc="720p Upscaler"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/ravu-lite-ar-r2.glsl

# Scaling
cscale=mitchell
dscale=hermite

[DehaloSharpShaders]
profile-cond=p.width > 426 and p.width < 1280
profile-desc="DehaloSharpShaders < 720p"
profile-restore=copy
glsl-shaders-append=#DATADIR#/ecotube/shaders/FineDehalo_lite_RT.glsl
glsl-shaders-append=#DATADIR#/ecotube/shaders/FineSharp_RT.glsl

glsl-shaders-append=#DATADIR#/ecotube/shaders/kVibrance_RT.glsl

[Vibrance240]
profile-cond=p.width < 427
profile-desc="Vibrance <= 240"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55

[SharpClean360]
profile-cond=p.width > 639 and p.width < 854
profile-desc="Sharpen and Clean Video"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55,FineDehalo_lite_RT/RX=1.0,RY=1.0,THMI=80,THMA=128,THLIMI=50,THLIMA=100,STR_D=0.92,STR_B=0.92,SENS_L=50,SENS_H=50,FineSharp_RT/SSTR=0.11,CSTR=0.18,LSTR=1.0,PSTR=1.0,XSTR=0.08,XREP=0.1

[SharpClean480]
profile-cond=p.width > 853 and p.width < 1280
profile-desc="Sharpen and Clean Video"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55,FineDehalo_lite_RT/RX=1.0,RY=1.0,THMI=90,THMA=150,THLIMI=55,THLIMA=110,STR_D=0.40,STR_B=0.40,SENS_L=35,SENS_H=35,FineSharp_RT/SSTR=0.08,CSTR=0.03,LSTR=1.0,PSTR=1.0,XSTR=0.0,XREP=0.0

[Vibrance720]
profile-cond=p.width > 1279
profile-desc="Color Vibrance"
profile-restore=copy
glsl-shader-opts=kVibrance_RT/STRENGTH=1.55

# HDR → SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)

# Dynamic Peak Detection
hdr-compute-peak=yes           # dynamically analyze HDR peak per-frame
hdr-peak-percentile=99.8       # ignore outlier pixels when computing peak
gamut-mapping-mode=perceptual  # natural-looking gamut compression

[Geometry]
profile-cond=p.width < 1920
profile-desc="Geometry"
profile-restore=copy
geometry=50%x50%
keepaspect=yes

glsl-shaders-append=#DATADIR#/ecotube/shaders/colorlevel_expand_luma.glsl
glsl-shaders-append=#DATADIR#/ecotube/shaders/DPID_RT.glsl
glsl-shaders-append=#DATADIR#/ecotube/shaders/cinegrain2.glsl
