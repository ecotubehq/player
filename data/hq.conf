# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

screenshot-format=png


# Set video decoder
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Core Cache
cache=yes
cache-secs=22
demuxer-readahead-secs=22
demuxer-max-bytes=30MiB
demuxer-max-back-bytes=20MiB

# Power Saving
demuxer-hysteresis-secs=15
cache-pause=yes
cache-pause-wait=22

# Set Dynamic Color
brightness=-0
contrast=-17
gamma=4
saturation=25.2

# Enable dithering
dither-depth=auto
dither=fruit
dither-size-fruit=6   

# Scaling
scale=hermite
cscale=hermite
dscale=hermite

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no

# Apply sigmoid upscaling
sigmoid-upscaling=yes
sigmoid-center=0.75
sigmoid-slope=4

# HDR → SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)

# Dynamic Peak Detection
hdr-compute-peak=yes           # dynamically analyze HDR peak per-frame
hdr-peak-percentile=99.8       # ignore outlier pixels when computing peak
gamut-mapping-mode=perceptual  # natural-looking gamut compression

# Apply RAVU to 144p video
[144p-RAVU]
profile-cond=p.width > 255 and p.width < 257
profile-desc="144p RAVU"
profile-restore=copy
glsl-shaders-append=./shaders/ravu-r4.hook
geometry=50%x50%
keepaspect=yes

# Apply ESPCN to 240p Portrait video
[240p-Portrait-ESPCN]
profile-cond=p.width < 241 and p.height <= 426
profile-desc="240p Portrait ESPCN"
profile-restore=copy
glsl-shaders-append=./shaders/espcn_x2_8.glsl
geometry=50%x50%
keepaspect=yes

# Apply RAVU to 240p video
[240p-RAVU]
profile-cond=p.width > 256 and p.width < 427
profile-desc="240p RAVU"
profile-restore=copy
glsl-shaders-append=./shaders/ravu-r4.hook
geometry=50%x50%
keepaspect=yes

# Apply RAVU to 360p video
[360p-RAVU]
profile-cond=p.width > 426 and p.width < 641
profile-desc="360p RAVU"
profile-restore=copy
glsl-shaders-append=./shaders/ravu-r4.hook
geometry=50%x50%
keepaspect=yes

# Apply RAVU to 480p video
[480p-RAVU]
profile-cond=p.width > 640 and p.width < 1280
profile-desc="480p RAVU"
profile-restore=copy
glsl-shaders-append=./shaders/ravu-r4.hook
geometry=50%x50%
keepaspect=yes

# Apply RAVU to 720p video
[720-RAVU]
profile-cond=p.width > 1279
profile-desc="720p+ RAVU"
profile-restore=copy
glsl-shaders-append=./shaders/ravu-r3.hook
geometry=50%x50%
keepaspect=yes

glsl-shaders-append=./shaders/dehaasn_ads_luma_RT.glsl
glsl-shaders-append=./shaders/colorlevel_expand_luma.glsl
glsl-shaders-append=./shaders/kVibrance_RT.glsl

[SharpenVideo144-240]
profile-cond=p.width < 427
profile-desc="Sharpen Video < 360p"
profile-restore=copy
glsl-shaders-append=./shaders/eq_clarity_RT.glsl

glsl-shaders-append=./shaders/PixelClipper_RT.glsl
glsl-shaders-append=./shaders/noise_static_luma.glsl
