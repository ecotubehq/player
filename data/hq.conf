# Try to avoid YouTube error 403 - Configure User-Agent
ytdl-raw-options=user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

screenshot-format=png

# Try modern video decoders first, then legacy, then auto-fallback
hwdec=vaapi,nvdec,vdpau,auto
vo=gpu-next

# Limit buffer to 30 sec
cache=yes
cache-secs=30
cache-pause-initial=yes
demuxer-readahead-secs=30
demuxer-max-back-bytes=24MiB
demuxer-max-bytes=64MiB
demuxer-cache-wait=yes

# Set color
brightness=-4
contrast=1
saturation=1.2

# Enable dithering
dither-depth=auto
dither=fruit
dither-size-fruit=6   

# Set scaling
scale=jinc
scale-window=kaiser
cscale=bilinear
dscale=hermite

# Temporal Scaling (Smooth motion)
interpolation=yes
tscale=oversample
tscale-window=quadric
tscale-radius=1.025
tscale-clamp=0.0

# Enable deband
deband=yes
deband-iterations=1
deband-threshold=24
deband-range=8
deband-grain=28

# Disable linear lighting & more
linear-downscaling=no
linear-upscaling=no
correct-downscaling=no

# Apply sigmoid upscaling
sigmoid-upscaling=yes
sigmoid-center=0.75
sigmoid-slope=4

# HDR → SDR Tone-Mapping
tone-mapping=auto              # let libplacebo pick the best algorithm
target-peak=100                # target ~100 nits (typical SDR display)
target-trc=bt.1886             # standard SDR gamma (close to 2.4)
target-prim=bt.709             # Rec.709 color gamut (standard SDR)

# Dynamic Peak Detection
hdr-compute-peak=yes           # dynamically analyze HDR peak per-frame
hdr-peak-percentile=99.8       # ignore outlier pixels when computing peak
gamut-mapping-mode=perceptual  # natural-looking gamut compression

glsl-shaders=./ecotube-CfL_Prediction.glsl
glsl-shaders-append=./ecotube-LumaSharpenHook.glsl